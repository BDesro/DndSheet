name: CI
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: A pull request into main must carry a new version
        if: github.base_ref == 'main'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          git ls-remote --exit-code --tags origin "refs/tags/v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Tag v$version already exists. Bump <Version> in Directory.Build.props and rewrite RELEASE_NOTES.md; merging this PR releases that version." }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Hearthsheet.slnx -c Release
      - run: dotnet test Hearthsheet.slnx -c Release --no-build
