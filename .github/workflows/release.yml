name: Release
# Push a tag like v1.2.0 (matching <Version> in Directory.Build.props) to publish a release that
# installed copies of the app will offer as an update. Uses the workflow's own GITHUB_TOKEN — no PAT.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check tag matches project version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          if ($tag -ne $version) { throw "Tag $tag does not match Directory.Build.props version $version" }
      - run: dotnet test DndSheet.slnx -c Release
      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          ./scripts/publish.ps1 -Version $version
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $args = @($tag, (Get-Item artifacts/*.zip).FullName, 'artifacts/SHA256SUMS.txt', '--title', "DndSheet $tag", '--generate-notes')
          if ($tag -match '-') { $args += '--prerelease' }
          gh release create @args
