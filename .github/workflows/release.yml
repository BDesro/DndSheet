name: Release
# Runs when a pull request is merged into main (a merge is a push to main). The version in Directory.Build.props
# decides the release: if it is newer than the latest release tag, the workflow tests, packages and publishes a release
# that creates tag v<version> on the merge commit. Otherwise (a merge that didn't bump the version) it does nothing.
# Uses the workflow's own GITHUB_TOKEN, no PAT. The release notes shown in the app's update dialog are RELEASE_NOTES.md:
# plain text, rewritten for each release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read version and check that it is newer than the latest release
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Select-Object -First 1
          ./scripts/check-version.ps1
          $new = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if (-not $new) { Write-Host "::warning::No release published: v$version is not newer than the latest release." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "new=$($new.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.new == 'true'
        with:
          dotnet-version: 10.0.x
      - name: Test
        if: steps.version.outputs.new == 'true'
        run: dotnet test Hearthsheet.slnx -c Release
      - name: Package
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Create release
        if: steps.version.outputs.new == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          gh release create $tag (Get-Item artifacts/*.zip).FullName artifacts/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Hearthsheet $tag" --notes-file RELEASE_NOTES.md
